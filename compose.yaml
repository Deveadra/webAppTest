services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blog-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DemoStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - blog_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  blog_sql_data:
