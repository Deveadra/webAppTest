services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blog-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - blog_sql_data:/var/opt/mssql

volumes:
  blog_sql_data: